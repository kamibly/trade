# Add this service block to the docker-compose.yml on the OCI VM (the same file
# that runs jobspy-service). It builds from the trade_folder folder next to
# docker-compose.yml (a copy of this server folder), then run:
#   docker compose up -d --build trade-service
#
# Host port 8898 is what the OCI load balancer and the app use; 8004 is the
# port inside the container.

services:
  trade-service:
    build: ./trade_folder
    container_name: trade-service
    restart: unless-stopped
    ports:
      - "8898:8004"
    environment:
      TRADE_API_KEY: "REPLACE_WITH_A_LONG_RANDOM_SECRET"
      ALLOWED_ORIGIN: "https://kamibly.github.io"
      # App notifications. Generate the two keys with:
      #   docker compose run --rm trade-service python generate_vapid_keys.py
      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: "mailto:you@example.com"
      # Quiet hours (22:00 to 07:00) and scan times use this time zone
      TRADE_TZ: "America/Toronto"
      # When the S&P 500 scan runs on weekdays (local time)
      MARKET_SCAN_TIMES: "09:45,10:15,10:45,11:15,11:45,12:15,12:45,13:15,13:45,14:15,14:45,15:15,15:45,20:00"
      # How often the crypto scan runs, around the clock
      CRYPTO_SCAN_MINUTES: "15"
      # Optional backup for stocks Yahoo Finance can't serve
      TWELVE_DATA_KEY: ""
      # Optional: when Yahoo or Nasdaq refuse the VM, send their requests through
      # this proxy for 30 minutes, such as a Tailscale container with a home
      # exit node (http:// or socks5://).
      # The proxy container must share a Docker network with this one.
      STOCK_PROXY: ""
      # When the machine-learning models retrain each week (local time)
      TRAIN_AT: "Sun 03:00"
      # Your email address. The SEC asks every program that reads its filings to
      # name a contact; insider buying and earnings dates load once it is set.
      # It stays on your server and is only sent to the SEC.
      SEC_CONTACT: ""
      # Optional: real crypto orders on NDAX (Settings, API Key in NDAX; the user
      # ID is under Personal User Info). Give the key trading permission only,
      # never withdrawals. Nothing is sent until you pick Live in the app.
      NDAX_API_KEY: ""
      NDAX_API_SECRET: ""
      NDAX_USER_ID: ""
      # Optional: stock orders on Interactive Brokers through IBKR's Web API in
      # the ibeam service below. Nothing is sent until you pick Paper in the app.
      IBKR_WEB_URL: "https://ibeam:5000"
      IBKR_IBEAM_URL: "http://ibeam:5001"
    # Training briefly needs about 1 GB; this keeps it from starving jobspy-service.
    mem_limit: 1500m
    volumes:
      # Keeps devices, synced holdings, scan results and models across restarts
      - ./trade_folder/trade-data:/data

  # Optional: IBeam runs IBKR's Web API gateway and logs in to Interactive
  # Brokers with a headless browser, so the trade service can place stock orders
  # in fractional shares (see ibkr.py). It needs about 1 GB of memory. Its API is
  # only reachable from containers on this Docker network: no ports are opened
  # on the VM. It starts idle and logs in only when you tap "Log in to IBKR" in
  # the app's Settings; you approve the login in IBKR Mobile. Then run:
  #   docker compose up -d ibeam
  ibeam:
    image: voyz/ibeam:0.5.13
    container_name: ibeam
    restart: unless-stopped
    environment:
      # Your IBKR username and password. For now, your own login in paper mode;
      # before live trading, the second username (no withdrawals).
      IBEAM_ACCOUNT: ""
      IBEAM_PASSWORD: ""
      IBEAM_USE_PAPER_ACCOUNT: "true"
      IBEAM_START_ACTIVE: "false"
      # Each login asks you to approve it in IBKR Mobile (IB Key). IBeam resends
      # the notification for about 5 minutes.
      IBEAM_TWO_FA_HANDLER: "NOTIFICATION_RESEND"
      # With more than one login method (such as a passkey and IB Key), IBKR's
      # page shows a "Select Second Factor Device" list: IBeam picks IB Key.
      # IBKR has given that list two different ids over time; this finds either.
      IBEAM_TWO_FA_SELECT_EL_ID: "CSS_SELECTOR@@#sf_select, select#xyz-field-bronze-response"
      IBEAM_TWO_FA_SELECT_TARGET: "IB Key"
      # Stops after 3 failed logins in a row; IBKR locks the account for a day after 10.
      IBEAM_MAX_FAILED_AUTH: "3"
    volumes:
      # Lets the trade service reach the gateway (conf.yaml)
      - ./trade_folder/ibeam-inputs:/srv/inputs
    mem_limit: 1200m
